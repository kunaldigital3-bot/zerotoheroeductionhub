<style>

* {

html,
body {

@keyframes logoMove {

/* ICON */

.icon {
    width: 61px;
    height: 61px;

    border-radius: 50%;

    align-items: center;

    font-size: 23px;

    box-shadow:
        0 7px 18px rgba(25,40,60,0.10),
        inset 0 1px 2px rgba(255,255,255,0.9);

/* TIMER */

.timer-row {

    display: flex;
    align-items: center;

    gap: 18px;

    margin-top: 3px;

    margin-bottom: 35px;
}


/* PROGRESS */

.progress-container {
    flex: 1;

    height: 9px;

    background: #cbd3dd;

    border-radius: 20px;

    position: relative;

    overflow: visible;
}


.progress-bar {
    position: absolute;

    left: 0;
    top: 0;

    height: 100%;

    width: 100%;

    background: #b28a20;

    border-radius: 20px;

    transition: width 1s linear;
}


/* ROUND DOT */

.progress-dot {
    position: absolute;

    top: 50%;
    right: -5px;

    width: 27px;
    height: 27px;

    transform: translateY(-50%);

    border-radius: 50%;

    background: #b28a20;

    box-shadow:
        0 0 0 5px rgba(178,138,32,0.15),
        0 3px 7px rgba(0,0,0,0.15);

    transition: right 1s linear;
}


/* TIMER TEXT */

.timer {
    min-width: 64px;

<script>

/* =========================
   55 SECOND TIMER
========================= */

let timeLeft = 55;

const totalTime = 55;

const timer =
    document.getElementById("timer");

const progressBar =
    document.getElementById("progressBar");

const progressDot =
    document.getElementById("progressDot");


function updateTimer() {

    let seconds = timeLeft;


    timer.textContent =
        "00:" +
        String(seconds).padStart(2, "0");


    /* LINE */

    const percentage =
        (timeLeft / totalTime) * 100;


    progressBar.style.width =
        percentage + "%";


    /* DOT */

    progressDot.style.right =
        (100 - percentage) + "%";


    /* STOP */

    if (timeLeft <= 0) {

        clearInterval(countdown);

        timer.textContent = "00:00";

        progressBar.style.width = "0%";

        progressDot.style.right = "100%";

        return;
    }


    timeLeft--;
}


/* START */

updateTimer();


const countdown =
    setInterval(updateTimer, 1000);

</script>
