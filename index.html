<style>

* {

html,
body {

body {

.logo {

@keyframes logoMove {

/* Heading */

.title {

/* Features */

.features {

.feature {

    gap: 22px;

    font-weight: 500;

    line-height: 1.25;
}

/* Feature Icon */

.icon {
    width: 61px;
    height: 61px;

    flex: 0 0 61px;

    background: rgba(255,255,255,0.9);

    display: flex;
    align-items: center;

    font-size: 27px;

    border: 1px solid rgba(130,130,130,0.13);

    box-shadow:
        0 7px 18px rgba(25,40,60,0.10),
        inset 0 1px 2px rgba(255,255,255,0.9);
}

/* Timer */

.timer-row {

    display: flex;
    align-items: center;

    gap: 20px;

    margin-top: 4px;
    margin-bottom: 35px;
}

/* Progress */

.progress-container {
    flex: 1;

    height: 10px;

    background: #cbd3dd;

    border-radius: 20px;

    overflow: hidden;

    position: relative;
}

.progress-bar {
    position: absolute;

    left: 0;
    top: 0;

    height: 100%;

    width: 100%;

    background: #b28a20;

    border-radius: 20px;

    transition: width 1s linear;
}

/* Little round handle */

.progress-dot {
    position: absolute;

    top: 50%;

    right: -5px;

    width: 28px;
    height: 28px;

    transform: translateY(-50%);

    border-radius: 50%;

    background: #b28a20;

    box-shadow:
        0 0 0 5px rgba(178,138,32,0.15),
        0 3px 7px rgba(0,0,0,0.15);

    transition: right 1s linear;
}

/* Time */

.timer {
    min-width: 65px;

    color: #102033;

    font-size: 21px;

    font-weight: 600;

    letter-spacing: 0.5px;

    text-align: right;

<script>

/* =========================
   55 SECOND COUNTDOWN
========================= */

let timeLeft = 55;

const totalTime = 55;

const timer = document.getElementById("timer");

const progressBar =
    document.getElementById("progressBar");

const progressDot =
    document.getElementById("progressDot");


function updateTimer() {

    let seconds = timeLeft;

    timer.textContent =
        "00:" + String(seconds).padStart(2, "0");


    /*
       Line becomes shorter
       as timer decreases
    */

    const percentage =
        (timeLeft / totalTime) * 100;

    progressBar.style.width =
        percentage + "%";


    /*
       Move the round handle
    */

    progressDot.style.right =
        (100 - percentage) + "%";


    if (timeLeft <= 0) {

        clearInterval(countdown);

        timer.textContent = "00:00";

        progressBar.style.width = "0%";

        progressDot.style.right = "100%";

        return;
    }

    timeLeft--;
}


/* Start immediately */

updateTimer();


/* Every 1 second */

const countdown =
    setInterval(updateTimer, 1000);

</script>
