<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #ffffff 0%,
            #f7f8fb 42%,
            #e9edf5 100%

/* =========================
   MAIN PAGE
========================= */

.page {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;

    padding: 165px 39px 70px;
}


/* =========================
   LOGO / DP
========================= */

.logo {
    display: block;

    width: 78px;
    height: 78px;

    object-fit: cover;

    border-radius: 50%;

    margin-bottom: 42px;

    background: #ffffff;

    box-shadow:
        0 8px 20px rgba(20, 35, 55, 0.12),
        0 0 0 5px rgba(255,255,255,0.85);

    animation: logoMove 3.5s ease-in-out infinite;
}


@keyframes logoMove {

    0%,
    100% {
        transform: translateX(-5px);
    }

    50% {
        transform: translateX(5px);
    }
}


/* =========================
   TITLE
========================= */

.title {
    color: #aa7b13;

    font-size: 42px;

    line-height: 1.13;

    font-weight: 800;

    letter-spacing: -1.5px;

    margin-bottom: 55px;
}


/* =========================
   FEATURES
========================= */

.features {
    display: flex;

    flex-direction: column;

    gap: 25px;

    margin-bottom: 55px;
}


.feature {
    display: flex;

    align-items: center;

    gap: 21px;

    color: #14263a;

    font-size: 20px;

    line-height: 1.25;

    font-weight: 500;
}


/* =========================
   FEATURE ICON
========================= */

.icon {
    width: 61px;
    height: 61px;

    flex: 0 0 61px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #ffffff;

    color: #ad8222;

    font-size: 23px;

    border: 1px solid rgba(120,130,145,0.12);

    box-shadow:
        0 8px 18px rgba(30,45,65,0.10),
        inset 0 1px 2px rgba(255,255,255,0.95);
}


/* =========================
   TIMER AREA
========================= */

.timer-row {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 18px;

    margin-bottom: 35px;
}


/* =========================
   PROGRESS BAR
========================= */

.progress-container {
    position: relative;

    flex: 1;

    height: 9px;

    background: #cbd3dd;

    border-radius: 20px;

    overflow: visible;
}


.progress-bar {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: #b28a20;

    border-radius: 20px;

    transition: width 1s linear;
}


/* =========================
   MOVING DOT
========================= */

.progress-dot {
    position: absolute;

    top: 50%;
    right: -5px;

    width: 27px;
    height: 27px;

    transform: translateY(-50%);

    border-radius: 50%;

    background: #b28a20;

    box-shadow:
        0 0 0 5px rgba(178,138,32,0.14),
        0 3px 8px rgba(0,0,0,0.14);

    transition: right 1s linear;
}


/* =========================
   TIMER TEXT
========================= */

.timer {
    min-width: 64px;

    color: #102033;

    font-size: 20px;

    line-height: 1;

    font-weight: 600;

    text-align: right;

    letter-spacing: 0.3px;
}


/* =========================
   TELEGRAM BUTTON
========================= */

    width: 100%;

    height: 91px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    border-radius: 50px;

    background: #092637;

    color: #ffffff;

    text-decoration: none;

    font-size: 22px;

    font-weight: 700;

    box-shadow:
        0 18px 28px rgba(8,30,48,0.20);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.telegram-btn:hover {
    transform: translateY(-2px);

        0 21px 32px rgba(8,30,48,0.24);
}


/* =========================

========================= */

<script>

/* =========================
   55 SECOND COUNTDOWN
========================= */

let timeLeft = 55;

const totalTime = 55;

const timer =
    document.getElementById("timer");

const progressBar =
    document.getElementById("progressBar");

const progressDot =
    document.getElementById("progressDot");


function updateTimer() {

    const seconds = timeLeft;


    /* TIMER TEXT */

    timer.textContent =
        "00:" +
        String(seconds).padStart(2, "0");


    /* PROGRESS */

    const percentage =
        (timeLeft / totalTime) * 100;


    progressBar.style.width =
        percentage + "%";


    /* DOT */

    progressDot.style.right =
        (100 - percentage) + "%";


    /* STOP AT ZERO */

    if (timeLeft <= 0) {

        clearInterval(countdown);

        timer.textContent = "00:00";

        progressBar.style.width = "0%";

        progressDot.style.right = "100%";

        return;
    }


    timeLeft--;
}


/* INITIAL */

updateTimer();


/* EVERY SECOND */

const countdown =
    setInterval(updateTimer, 1000);

</script>
