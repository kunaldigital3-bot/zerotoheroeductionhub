<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:radial-gradient(circle at 50% 0%,#fff 0%,#f5f7fb 45%,#e9edf5 100%);color:#102033;min-height:100vh;display:flex;justify-content:center;overflow-x:hidden;}

.logo{width:78px;height:78px;border-radius:50%;object-fit:cover;display:block;margin-bottom:40px;box-shadow:0 7px 18px rgba(0,0,0,0.12),0 0 0 5px rgba(255,255,255,0.7);animation:logoMove 3.5s ease-in-out infinite;}

.title{color:#a77b13;font-size:42px;line-height:1.12;font-weight:800;letter-spacing:-1.5px;margin-bottom:48px;}
.features{display:flex;flex-direction:column;gap:24px;margin-bottom:50px;}
.feature{display:flex;align-items:center;gap:21px;color:#14263a;font-size:20px;font-weight:500;}
.icon{width:61px;height:61px;flex:0 0 61px;border-radius:50%;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center;color:#ae8220;font-size:23px;border:1px solid rgba(130,130,130,0.13);box-shadow:0 7px 18px rgba(25,40,60,0.10),inset 0 1px 2px rgba(255,255,255,0.9);}
.timer-row{display:flex;align-items:center;gap:18px;margin-top:3px;margin-bottom:35px;}
.progress-container{flex:1;height:9px;background:#cbd3dd;border-radius:20px;position:relative;}
.progress-bar{position:absolute;left:0;top:0;height:100%;width:100%;background:#b28a20;border-radius:20px;transition:width 1s linear;}
.progress-dot{position:absolute;top:50%;right:-5px;width:27px;height:27px;transform:translateY(-50%);border-radius:50%;background:#b28a20;box-shadow:0 0 0 5px rgba(178,138,32,0.15),0 3px 7px rgba(0,0,0,0.15);transition:right 1s linear;}
.timer{min-width:64px;color:#102033;font-size:20px;font-weight:600;text-align:right;}
.telegram-btn{width:100%;height:91px;border-radius:50px;background:#092437;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:12px;font-size:22px;font-weight:700;box-shadow:0 18px 28px rgba(8,30,48,0.20);transition:transform 0.2s ease;}
.telegram-btn:hover{transform:translateY(-2px);}
.telegram-icon{width:29px;height:29px;border-radius:50%;background:#fff;color:#092437;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;}
.subscribers{text-align:center;color:#788494;font-size:18px;margin-top:29px;font-weight:500;}
.disclaimer{text-align:center;color:#7b8999;font-size:14px;line-height:1.7;margin-top:54px;padding:0 5px;}
@media(max-width:380px){.page{padding:120px 20px 50px;}.title{font-size:36px;}.feature{font-size:18px;}.icon{width:52px;height:52px;flex-basis:52px;}.telegram-btn{height:75px;font-size:19px;}}

<body>
<div class="page">
    <img src="logo.png" class="logo" alt="ZERO TO HERO">
    <h1 class="title">Zero to Hero Expert</h1>
    <div class="features">
        <div class="feature"><div class="icon">📊</div><span>Daily Intraday Calls</span></div>
        <div class="feature"><div class="icon">📈</div><span>Swing Trading Ideas</span></div>
        <div class="feature"><div class="icon">🎯</div><span>Entry &amp; Exit Levels</span></div>
        <div class="feature"><div class="icon">🛡️</div><span>Risk Management</span></div>
    </div>
    <div class="timer-row">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-dot" id="progressDot"></div>
        </div>
        <div class="timer" id="timer">00:55</div>
    </div>
    <a href="https://t.me/+JRm7zWfdBN4wMmE1" class="telegram-btn" target="_blank">
        <span class="telegram-icon">➤</span>
        <span>Join Telegram</span>
    </a>
    <div class="subscribers">37,000+ subscribers</div>
    <div class="disclaimer">
        Risk Disclaimer: Investment in Securities market are subject to market risks.<br>
        Please read all the related documents carefully before Investing.
    </div>
</div>
<script>
let timeLeft = 55;
const timer = document.getElementById("timer");
const progressBar = document.getElementById("progressBar");
const progressDot = document.getElementById("progressDot");

function updateTimer() {
    timer.textContent = "00:" + String(timeLeft).padStart(2, "0");
    const percentage = (timeLeft / 55) * 100;
    progressBar.style.width = percentage + "%";
    progressDot.style.right = (100 - percentage) + "%";
    if (timeLeft <= 0) {
        clearInterval(countdown);
        timer.textContent = "00:00";
        progressBar.style.width = "0%";
        progressDot.style.right = "100%";
        return;
    }
    timeLeft--;
}
updateTimer();
const countdown = setInterval(updateTimer, 1000);
</script>
