<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZERO TO HERO TRADING</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#f3f5f9;
    color:#13243a;
    overflow-x:hidden;
}

.page{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    padding:70px 38px 45px;
}

/* DP */
.logo{
    width:68px;
    height:68px;
    object-fit:cover;
    border-radius:50%;
    display:block;
    margin-bottom:38px;
    background:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,.10);
    animation:moveDP 3s ease-in-out infinite;
}

@keyframes moveDP{
    0%,100%{transform:translateX(-4px)}
    50%{transform:translateX(4px)}
}

/* NAME */
.title{
    color:#aa7b13;
    font-size:32px;
    line-height:1.12;
    font-weight:800;
    letter-spacing:-.8px;
    margin-bottom:42px;
}

/* FEATURES */
.features{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin-bottom:42px;
}

.feature{
    display:flex;
    align-items:center;
    gap:17px;
    color:#15263a;
    font-size:16px;
    line-height:1.2;
    font-weight:500;
}

.icon{
    width:50px;
    height:50px;
    min-width:50px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    color:#ad8222;
    font-size:19px;
    border:1px solid rgba(120,130,145,.12);
    box-shadow:0 6px 14px rgba(30,45,65,.10);
}

/* TIMER */
.timer-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:28px;
}

.progress-container{
    position:relative;
    flex:1;
    height:8px;
    background:#cbd3dd;
    border-radius:20px;
}

.progress-bar{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#b28a20;
    border-radius:20px;
    transition:width 1s linear;
}

.progress-dot{
    position:absolute;
    top:50%;
    right:-4px;
    width:22px;
    height:22px;
    transform:translateY(-50%);
    border-radius:50%;
    background:#b28a20;
    box-shadow:0 0 0 4px rgba(178,138,32,.13);
}

.timer{
    min-width:53px;
    color:#13243a;
    font-size:16px;
    font-weight:600;
    text-align:right;
}

/* TELEGRAM */
.telegram-btn{
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    border-radius:38px;
    background:#092637;
    color:#fff;
    text-decoration:none;
    font-size:18px;
    font-weight:700;
    box-shadow:0 12px 22px rgba(8,30,48,.18);
}

.telegram-icon{
    width:25px;
    height:25px;
    border-radius:50%;
    background:#fff;
    color:#092637;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:800;
}

/* SUBSCRIBERS */
.subscribers{
    text-align:center;
    margin-top:22px;
    color:#7b8796;
    font-size:15px;
    font-weight:500;
}

/* DISCLAIMER */
.disclaimer{
    text-align:center;
    margin-top:40px;
    color:#7b8796;
    font-size:12px;
    line-height:1.6;
}

/* SMALL MOBILE */
@media(max-width:380px){

    .page{
        padding:55px 25px 35px;
    }

    .logo{
        width:60px;
        height:60px;
        margin-bottom:30px;
    }

    .title{
        font-size:28px;
        margin-bottom:35px;
    }

    .features{
        gap:17px;
        margin-bottom:35px;
    }

    .feature{
        font-size:15px;
        gap:14px;
    }

    .icon{
        width:46px;
        height:46px;
        min-width:46px;
        font-size:17px;
    }

    .timer-row{
        margin-bottom:23px;
    }

    .telegram-btn{
        height:62px;
        font-size:17px;
    }

    .subscribers{
        font-size:14px;
        margin-top:18px;
    }

    .disclaimer{
        font-size:11px;
        margin-top:30px;
    }
}
</style>
</head>

<body>

<div class="page">

    <img src="logo.png" class="logo" alt="ZERO TO HERO">

    <h1 class="title">ZERO TO HERO TRADING</h1>

    <div class="features">

        <div class="feature">
            <div class="icon">▥</div>
            <span>Daily Intraday Calls</span>
        </div>

        <div class="feature">
            <div class="icon">↗</div>
            <span>Swing Trading Ideas</span>
        </div>

        <div class="feature">
            <div class="icon">◎</div>
            <span>Entry &amp; Exit Levels</span>
        </div>

        <div class="feature">
            <div class="icon">♢</div>
            <span>Risk Management</span>
        </div>

    </div>

    <div class="timer-row">

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-dot" id="progressDot"></div>
        </div>

        <div class="timer" id="timer">00:55</div>

    </div>

    <a
        href="https://t.me/+JRm7zWfdBN4wMmE1"
        class="telegram-btn"
        target="_blank"
        rel="noopener noreferrer">

        <span class="telegram-icon">➤</span>
        <span>Join Telegram</span>

    </a>

    <div class="subscribers">
        37,000+ subscribers
    </div>

    <div class="disclaimer">
        Risk Disclaimer: Investment in Securities market are subject to market risks.<br>
        Please read all the related documents carefully before Investing.
    </div>

</div>

<script>
let timeLeft = 55;
const totalTime = 55;

const timer = document.getElementById("timer");
const progressBar = document.getElementById("progressBar");
const progressDot = document.getElementById("progressDot");

function updateTimer(){

    timer.textContent =
        "00:" + String(timeLeft).padStart(2,"0");

    const percentage =
        (timeLeft / totalTime) * 100;

    progressBar.style.width =
        percentage + "%";

    progressDot.style.right =
        (100 - percentage) + "%";

    if(timeLeft <= 0){
        clearInterval(countdown);
        timer.textContent = "00:00";
        progressBar.style.width = "0%";
        progressDot.style.right = "100%";
        return;
    }

    timeLeft--;
}

updateTimer();

const countdown = setInterval(updateTimer,1000);
</script>

</body>
</html>
